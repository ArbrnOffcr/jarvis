# Baut bei jeder Veröffentlichung (GitHub-Release) zusätzlich JARVIS-Setup.exe für Windows und hängt sie an.
name: Windows-Setup
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Paket vorbereiten
        shell: pwsh
        run: |
          $v = (Select-String -Path atlas\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "JARVIS_VERSION=$v" | Out-File -Append $env:GITHUB_ENV
          New-Item -ItemType Directory paket\installer, paket\installer\programm | Out-Null
          Copy-Item windows\installieren.ps1 paket\installer\
          Get-ChildItem -Force | Where-Object { $_.Name -notin @('.git', 'paket', '.github') } | Copy-Item -Recurse -Destination paket\installer\programm
          @{ version = $v; sha = "${{ github.sha }}"; repo = "${{ github.repository }}" } | ConvertTo-Json | Set-Content paket\installer\release.json
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows\JARVIS.iss
      - name: An das Release hängen
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" (Get-ChildItem ausgabe\*.exe).FullName --clobber
