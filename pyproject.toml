[project]
name = "atlas-assistant"
version = "0.6.0"
description = "JARVIS – persönlicher AI-Assistent für macOS"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.40",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12.0",
  "rich>=13.7",
  "prompt_toolkit>=3.0",
  "pyyaml>=6.0",
  "keyring>=25.0",
  "caldav>=1.3",
  "icalendar>=5.0",
  "recurring-ical-events>=2.1",
  "numpy>=1.26",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=0.6.23",
  "pillow>=10.0",
  "pillow-heif>=0.16",
  "ocrmac>=1.0; sys_platform == 'darwin'",
  "pywebview>=5.0; sys_platform == 'darwin'",
  "mlx-whisper>=0.4; sys_platform == 'darwin'",
  "openwakeword>=0.6",
  "onnxruntime>=1.17",
  "qrcode>=7.4",
]

[project.scripts]
jarvis = "atlas.cli:main"
atlas = "atlas.cli:main"
atlas-core = "atlas.server:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.setuptools.package-data]
atlas = ["web/*"]
